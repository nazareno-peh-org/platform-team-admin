# CircleCI Configuration for Infrastructure Automation
version: 2.1

# Global context reference for workflows
globals: &context
  context:
    - PLATFORM_ADMIN

# Filter patterns for selective job execution
filter_definitions:
  push_main: &push_main
    filters:
      branches:
        only:
          - main

  tag_main: &tag_main
    filters:
      tags:
        only: /^v.*/
      branches:
        ignore: /.*/

jobs:
  pulumi-preview:
    machine: true
    resource_class: nazareno-peh-org/dev-runner # ou o nome que você registrou no runner
    steps:
      - checkout
      - run:
          name: Install uv and dependencies
          command: |
            # 1. Instala o uv se não estiver presente no runner
            command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
            
            # Garante o uv no PATH do CircleCI
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

            # 2. Sincroniza o projeto e ambiente virtual com uv
            uv sync
      - run:
          name: Pulumi Preview via uv
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run pulumi stack select dev || uv run pulumi stack init dev
            uv run pulumi preview --color always --non-interactive

  pulumi-up:
    machine: true
    resource_class: nazareno-peh-org/dev-runner
    steps:
      - checkout
      - run:
          name: Install Python dependencies
          command: |
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f pyproject.toml ]; then pip install .; fi
      - run:
          name: Pulumi Up
          command: |
            pulumi stack select dev || pulumi stack init dev
            pulumi up --yes --color always --non-interactive

workflows:
  preview:
    jobs:
      - pulumi-preview:
          <<: *context
          <<: *push_main

  update:
    jobs:
      - pulumi-preview:
          <<: *context
          <<: *tag_main
      - approve-deployment:
          type: approval
          requires:
            - pulumi-preview
          <<: *tag_main
      - pulumi-up:
          <<: *context
          requires:
            - approve-deployment
          <<: *tag_main
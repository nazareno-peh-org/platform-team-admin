# CircleCI Configuration for Infrastructure Automation
version: 2.1

# Global context reference for workflows
globals: &context
  context:
    - PLATFORM_ADMIN

# Filter patterns for selective job execution
filter_definitions:
  push_main: &push_main
    filters:
      branches:
        only:
          - main

  tag_main: &tag_main
    filters:
      tags:
        only: /^v.*/
      branches:
        ignore: /.*/

jobs:
  pulumi-preview:
    machine: true
    resource_class: nazareno-peh-org/dev-runner
    steps:
      - checkout
      - run:
          name: Setup uv and sync dependencies
          command: |
            # 1. Garante a instalação do uv
            command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

            # 2. Sincroniza todas as dependências isoladas (incluindo pulumi-github)
            uv sync
      - run:
          name: Pulumi Preview via uv
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run pulumi stack select dev || uv run pulumi stack init dev
            uv run pulumi preview --color always --non-interactive

  pulumi-up:
    machine: true
    resource_class: nazareno-peh-org/dev-runner
    steps:
      - checkout
      - run:
          name: Setup uv and sync dependencies
          command: |
            # 1. Garante a instalação do uv
            command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV

            # 2. Sincroniza todas as dependências isoladas
            uv sync
      - run:
          name: Pulumi Up via uv
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run pulumi stack select dev || uv run pulumi stack init dev
            uv run pulumi up --yes --color always --non-interactive

workflows:
  preview:
    jobs:
      - pulumi-preview:
          <<: *context
          <<: *push_main

  update:
    jobs:
      - pulumi-preview:
          <<: *context
          <<: *tag_main
      - approve-deployment:
          type: approval
          requires:
            - pulumi-preview
          <<: *tag_main
      - pulumi-up:
          <<: *context
          requires:
            - approve-deployment
          <<: *tag_main